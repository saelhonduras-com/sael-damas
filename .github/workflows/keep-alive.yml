name: Mantener el backend despierto (evento 3-18 octubre, 6am-10pm Honduras)

# Corre SOLO entre el 3 y el 18 de octubre de 2026, y dentro de eso, solo entre las 6:00 a.m. y
# las 10:00 p.m. hora de Honduras (UTC-6). Fuera de esas fechas, este archivo no hace nada — el
# backend vuelve a dormirse normal, como siempre.
#
# ⚠️ IMPORTANTE: este horario se repite automáticamente CADA AÑO en estas mismas fechas de
# octubre, a menos que borres o desactives este archivo después del evento. No se apaga solo de
# forma permanente — hay que quitarlo a mano (o comentar la línea "schedule") cuando ya no se
# necesite.
#
# Nota técnica: el rango de días (3-19) incluye un día extra a propósito, para cubrir
# correctamente la noche del 18 de octubre (por la diferencia de horario entre Honduras y UTC,
# que es lo que usa GitHub Actions para programar tareas).
on:
  schedule:
    - cron: '*/14 12-23,0-3 3-19 10 *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar el backend Y la base de datos, para que no se duerma ninguno
        run: curl -sf https://sael-damas.onrender.com/api/salud-completa || echo "No respondió, pero no es grave — se reintenta en 14 minutos."
